{% extends 'admin/master.html' %}

{% block content %}
    <main class="app-main">

        <div class="app-content-header">

            <div class="container-fluid">

                <div class="row">
                    <div class="col-sm-6">
                        <h3 class="mb-0">Users List</h3>
                    </div>
                    <div class="col-sm-6">
                        <ol class="breadcrumb float-sm-end">
                            <li class="breadcrumb-item"><a href="#">Home</a></li>
                            <li class="breadcrumb-item active" aria-current="page">Users</li>
                        </ol>
                    </div>
                </div>
            </div>
        </div>
        <div class="app-content">
            <div class="container-fluid">
                <div class="row">
                    <div class="col-lg-12 col-12">
                        <div class="card">
                            <div class="card-header">

                                <a href="{{ url_for('admin_bp.add_user') }}" class="btn btn-primary">
                                    <i class="bi bi-plus-circle"></i>
                                    Add New User
                                </a>
                            </div>
                            <div class="card-body">
                                <table id="userTable" class="table table-striped table-bordered" style="width:100%">
                                    <thead>
                                    <tr>
                                        <th>ID</th>
                                        <th>Profile</th>
                                        <th>Name</th>
                                        <th>Email</th>
                                        <th>Role</th>
                                        <th>Actions</th>
                                    </tr>
                                    </thead>
                                    <tbody>
                                    <tr>
                                        <td>1</td>
                                        <td>
                                            <img
                                                    src="{{ url_for('static', filename='admin/image/no_image.png') }}"
                                                    alt="username"
                                                    style="width: 50px; height: 50px; object-fit: contain; border-radius: 50%;"
                                                    onerror="this.src='{{ url_for('static', filename='admin/image/no_image.png') }}';"
                                            >
                                        </td>
                                        <td>heng dara</td>
                                        <td>dara@mail.com</td>
                                        <td>admin</td>
                                        <td>
                                            <!-- Add action buttons here -->
                                            <a href="{{ url_for('admin_bp.edit_user', user_id=1) }}"
                                               class="btn btn-sm btn-primary">
                                                <i class="bi bi-pencil-square"></i>
                                                Edit
                                            </a>
                                            <a href="{{ url_for('admin_bp.confirm_delete', user_id=1) }}"
                                               class="btn btn-sm btn-danger">
                                                <i class="bi bi-trash3"></i>
                                                Delete
                                            </a>
                                        </td>
                                    </tr>
                                    </tbody>
                                </table>
                            </div>
                        </div>
                    </div>
                </div>
            </div>

        </div>
        </div>
        </div>
    </main>
{% endblock %}
