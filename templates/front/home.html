{% extends 'front/master.html' %}
{% block content %}
    <!-- Categories -->
    <section class="container my-5">
        <h2 class="mb-4">Categories</h2>
        <div class="row text-center">
            <div class="col-md-4">
                <div class="card p-3">Electronics</div>
            </div>
            <div class="col-md-4">
                <div class="card p-3">Clothing</div>
            </div>
            <div class="col-md-4">
                <div class="card p-3">Accessories</div>
            </div>
        </div>
    </section>

    <!-- Products -->
    <section class="container my-5">
        <h2 class="mb-4">Featured Products</h2>
        <div class="row">

            <div class="row">
                {% for item in range(10) %}
                    <!-- Product 1 -->
                    <div class="col-md-3">
                        <div class="card product-card">
                            <img src="https://fakestoreapi.com/img/81fPKd-2AYL._AC_SL1500_t.png" class="card-img-top">
                            <div class="card-body">
                                <h5 class="card-title line-clamp-1">Fjallraven - Foldsack No. 1 Backpack, Fits 15
                                    Laptops</h5>
                                <p>$109.95</p>
                                <button class="btn btn-primary w-100">Add to Cart</button>
                            </div>
                        </div>
                    </div>
                {% endfor %}

            </div>
        </div>

        </div>
    </section>

{% endblock content %}
