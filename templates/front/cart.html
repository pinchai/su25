{% extends 'front/master.html' %}
{% block content %}
    <!-- Cart Section -->
    <div class="container my-5">
        <h2 class="mb-4">🛒 Your Cart</h2>

        <div class="table-responsive">
            <table class="table align-middle">
                <thead class="table-light">
                <tr>
                    <th>Product</th>
                    <th>Price</th>
                    <th width="120">Quantity</th>
                    <th>Total</th>
                    <th></th>
                </tr>
                </thead>

                <tbody>
                <!-- Product 1 -->
                <tr>
                    <td>
                        <div class="d-flex align-items-center">
                            <img src="https://fakestoreapi.com/img/81fPKd-2AYL._AC_SL1500_t.png" width="60"
                                 class="me-3">
                            <span>Fjallraven Backpack</span>
                        </div>
                    </td>
                    <td>$109.95</td>
                    <td>
                        <input type="number" value="1" class="form-control">
                    </td>
                    <td>$109.95</td>
                    <td>
                        <button class="btn btn-danger btn-sm">Remove</button>
                    </td>
                </tr>

                <!-- Product 2 -->
                <tr>
                    <td>
                        <div class="d-flex align-items-center">
                            <img src="https://fakestoreapi.com/img/71-3HjGNDUL._AC_SY879._SX._UX._SY._UY_t.png"
                                 width="60" class="me-3">
                            <span>Mens Slim Fit T-Shirt</span>
                        </div>
                    </td>
                    <td>$22.30</td>
                    <td>
                        <input type="number" value="2" class="form-control">
                    </td>
                    <td>$44.60</td>
                    <td>
                        <button class="btn btn-danger btn-sm">Remove</button>
                    </td>
                </tr>
                </tbody>
            </table>
        </div>

        <!-- Summary -->
        <div class="row justify-content-end">
            <div class="col-md-4">
                <div class="card p-3">
                    <h5>Order Summary</h5>
                    <hr>
                    <p class="d-flex justify-content-between">
                        <span>Subtotal</span>
                        <span>$154.55</span>
                    </p>
                    <p class="d-flex justify-content-between">
                        <span>Shipping</span>
                        <span>$5.00</span>
                    </p>
                    <hr>
                    <h5 class="d-flex justify-content-between">
                        <span>Total</span>
                        <span>$159.55</span>
                    </h5>

                    <a href="{{ url_for('front_bp.checkout') }}" class="btn btn-success w-100 mt-3">
                        Checkout
                    </a>
                </div>
            </div>
        </div>
    </div>
{% endblock content %}
