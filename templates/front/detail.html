{% extends 'front/master.html' %}
{% block content %}
    <!-- Cart Section -->

    <!-- Product Detail -->
    <div class="container my-5">
        <div class="row">

            <!-- Product Image -->
            <div class="col-md-6 text-center">
                <img src="{{ image }}"
                     class="img-fluid border p-3"
                     style="max-height: 400px; object-fit: contain;">
            </div>

            <!-- Product Info -->
            <div class="col-md-6">
                <h2 class="fw-bold">
                   {{ title }}
                </h2>

                <p class="text-muted">Category: {{ category }}</p>

                <h3 class="text-primary">${{ price }}</h3>

                <hr>

                <p>
                    {{ description }}
                </p>

                <!-- Quantity -->
                <div class="mb-3">
                    <label class="form-label">Quantity</label>
                    <input type="number" class="form-control w-25" value="1">
                </div>

                <!-- Buttons -->
                <div class="d-flex gap-2">
                    <button class="btn btn-primary">
                        Add to Cart
                    </button>

                    <button class="btn btn-success">
                        Buy Now
                    </button>
                </div>
            </div>

        </div>
    </div>
{% endblock content %}
