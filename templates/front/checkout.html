{% extends 'front/master.html' %}
{% block content %}
    <div class="container my-5">
        <div class="row">
            <!-- Billing Form -->
            <div class="col-md-6">
                <h4 class="mb-3">Billing Details</h4>

                <form>
                    <div class="mb-3">
                        <label class="form-label">Full Name</label>
                        <input type="text" class="form-control" placeholder="John Doe">
                    </div>

                    <div class="mb-3">
                        <label class="form-label">Phone Number</label>
                        <input type="text" class="form-control" placeholder="012345678">
                    </div>

                    <div class="mb-3">
                        <label class="form-label">Address</label>
                        <textarea class="form-control" rows="3"></textarea>
                    </div>

                    <div class="mb-3">
                        <label class="form-label">City</label>
                        <input type="text" class="form-control" placeholder="Phnom Penh">
                    </div>
                </form>
            </div>
            <!-- Order Summary + QR -->
            <div class="col-md-6">
                <div class="card p-3">
                    <h5>Order Summary</h5>
                    <hr>

                    <p class="d-flex justify-content-between">
                        <span>Fjallraven Backpack</span>
                        <span>$109.95</span>
                    </p>

                    <p class="d-flex justify-content-between">
                        <span>Mens T-Shirt</span>
                        <span>$44.60</span>
                    </p>

                    <hr>

                    <h5 class="d-flex justify-content-between">
                        <span>Total</span>
                        <span>$154.55</span>
                    </h5>

                    <hr>

                    <!-- QR Payment -->
                    <div class="text-center mt-3">
                        <h6>Scan to Pay</h6>
                        <img src="https://codigosdebarrasbrasil.com.br/wp-content/uploads/2019/09/codigo_qr-300x300.png"
                             class="img-fluid border p-2"
                             alt="QR Code">

                        <p class="mt-2 text-muted">
                            Use ABA / KHQR / Mobile Banking
                        </p>
                    </div>

                    <button class="btn btn-success w-100 mt-3">
                        Confirm Order
                    </button>
                </div>
            </div>
        </div>
    </div>
{% endblock content %}
