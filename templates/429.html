<!doctype html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Too Many Requests</title>

    <style>
        body{
            margin:0;
            padding:0;
            height:100vh;
            display:flex;
            justify-content:center;
            align-items:center;
            background:#f5f5f5;
            font-family:Arial, sans-serif;
        }

        .card{
            width:400px;
            background:white;
            padding:30px;
            border-radius:10px;
            box-shadow:0 0 10px rgba(0,0,0,0.1);
            text-align:center;
        }

        h1{
            color:#dc3545;
            margin-bottom:10px;
        }

        p{
            color:#555;
        }

        .ip{
            margin-top:20px;
            padding:10px;
            background:#eee;
            border-radius:5px;
            font-weight:bold;
        }

        a{
            display:inline-block;
            margin-top:20px;
            text-decoration:none;
            background:#007bff;
            color:white;
            padding:10px 20px;
            border-radius:5px;
        }
    </style>
</head>
<body>

<div class="card">
    <h1>429</h1>

    <p>Too many requests.</p>

    <p>Please wait a moment and try again.</p>

    <div class="ip">
        Your IP: {{ ip }}
    </div>

    <p>{{ error }}</p>

    <a href="/">Back Home</a>
</div>

</body>
</html>
